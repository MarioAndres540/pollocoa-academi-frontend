<div class="min-h-screen flex bg-gray-100">
  <!-- Sidebar -->
  <aside class="w-64 bg-red-700 text-white flex flex-col p-4 shadow-lg">
    <div class="mb-6">
      <h1 class="text-xl font-bold">Pollocoa</h1>
      <p class="text-sm">Gestión Académica</p>
    </div>

    <nav class="flex-1 space-y-2">
      <a routerLink="estudiantes" routerLinkActive="bg-red-600" class="block px-3 py-2 rounded hover:bg-red-600">Estudiantes</a>
      <a routerLink="materias" routerLinkActive="bg-red-600" class="block px-3 py-2 rounded hover:bg-red-600">Materias</a>
      <a routerLink="notas" routerLinkActive="bg-red-600" class="block px-3 py-2 rounded hover:bg-red-600">Notas</a>
    </nav>

    <button (click)="logout()" class="mt-auto bg-red-900 hover:bg-red-800 text-sm px-3 py-2 rounded">
      Cerrar sesión
    </button>
  </aside>

  <!-- Main content -->
  <div class="flex-1 flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
      <div>
        <h2 class="text-lg font-semibold text-gray-700">Panel de Control</h2>
      </div>
      <div class="text-right text-sm text-gray-600">
        <p>{{ user?.nombre || 'Profesor Demo' }}</p>
        <p>{{ user?.email || 'profesor@pollocoa.com' }}</p>
      </div>
    </header>

    <!-- Router outlet -->
    <main class="flex-1 p-6">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-500 py-4">
      © 2025 Pollocoa - Excelencia en Educación y Cárnicos
    </footer>
  </div>
</div>
