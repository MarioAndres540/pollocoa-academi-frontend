<!-- login.component.html -->
<div class="min-h-screen flex flex-col items-center justify-center bg-red-50 px-4">
  <!-- Card -->
  <div class="w-full max-w-md bg-white shadow-lg rounded-lg border-t-4 border-red-600 p-6">
    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🍗</div>
      <h1 class="text-2xl font-bold text-gray-800">Pollocoa</h1>
      <p class="text-gray-600">Sistema de Gestión Académica</p>
    </div>

    <!-- Form -->
    <form  [formGroup]="formLogin" (ngSubmit)="onSubmitLogin()" autocomplete="off" class="space-y-4">
      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="profesor@pollocoa.com"
          class="mt-1 block w-full h-8 rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500 sm:text-sm"
          required
        />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="********"
          class="mt-1 block w-full h-8 rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500 sm:text-sm"
          required
        />
      </div>

      <!-- Button -->
      <button
        type="submit"
        class="w-full bg-red-600 text-white py-2 px-4 rounded-md shadow hover:bg-red-700 transition"
      >
        Iniciar Sesión
      </button>

      <!-- Register -->
      <div class="text-center text-sm text-gray-600 mt-2">
        ¿No tienes una cuenta?
        <a type="button" (click)="registrarse()" class="text-red-600 hover:underline">Regístrate aquí</a>
      </div>

      <!-- Divider -->
      <div class="border-t border-gray-200 my-4"></div>

      <!-- Test credentials -->
      <div class="text-sm text-gray-700">
        <h3 class="font-semibold text-red-700 mb-1">Ejemplo de Credenciales</h3>
        <p><strong>Email:</strong> profesor@pollocoa.com</p>
        <p><strong>Contraseña:</strong> pollocoa2025</p>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <footer class="mt-6 text-xs text-gray-500 text-center">
    © 2025 Pollocoa - Excelencia en Educación y Cárnicos
  </footer>
</div>
